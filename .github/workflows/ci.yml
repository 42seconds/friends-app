# &FRIENDS continuous integration.
# Every push and pull request is typechecked, unit tested, has its
# Firestore rules tested against the emulator, and is built into an
# Android APK that can be downloaded from the run's "Artifacts" section.
name: CI

# Pushes to master, and every pull request into master (which covers
# pushes to its branch), so each commit is checked once.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # "labeled" so adding the build-ios label starts an iOS build.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# A newer push to the same branch cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --ci

  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --legacy-peer-deps
      - name: Rules tests (local emulator, never the live database)
        run: npm run test:rules

  android:
    name: Build Android APK
    needs: [checks, rules]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci --legacy-peer-deps
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
      # Release build, signed with the debug key so it installs straight
      # onto a phone. arm64 only: that covers modern Android phones and
      # keeps the build fast.
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: friends-app-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  # iOS simulator build. macOS minutes cost 10x on private repos, so this
  # runs on pushes to master, on manual runs (Actions → CI → Run workflow)
  # and on pull requests labelled build-ios, not on every commit.
  # A simulator build needs no Apple account; installing on a real
  # iPhone needs an Apple Developer account to sign the app.
  ios:
    name: Build iOS app (simulator)
    needs: [checks, rules]
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build-ios')
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci --legacy-peer-deps
      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Build app
        working-directory: ios
        # The Xcode project is named after the app's name in app.json, so
        # look it up rather than hard-coding it.
        run: |
          set -o pipefail
          WS=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WS%.xcworkspace}"
          echo "Building $SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -n 200
      - name: Zip app
        run: |
          APP=$(ls -d ios/build/Build/Products/Release-iphonesimulator/*.app | head -n 1)
          ditto -c -k --keepParent "$APP" friends-app-ios-simulator.zip
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: friends-app-ios-simulator-${{ github.sha }}
          path: friends-app-ios-simulator.zip
          retention-days: 30

  # The web version, which is how iPhone users get the app (Safari →
  # Share → Add to Home Screen). Every push to master that passes the
  # checks is published to https://andfriends-c5552.web.app.
  # Needs the FIREBASE_SERVICE_ACCOUNT_ANDFRIENDS_C5552 repository secret
  # (see docs/iphone-web-app.md); without it the build still runs and the
  # publish step is skipped.
  web:
    name: Publish web app (iPhone)
    needs: [checks, rules]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANDFRIENDS_C5552 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Build web app
        run: npx expo export --platform web
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: friends-app-web-${{ github.sha }}
          path: dist
          retention-days: 14
      - name: Publish to Firebase Hosting
        if: env.FIREBASE_SA != '' && github.ref == 'refs/heads/master'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANDFRIENDS_C5552 }}
          projectId: andfriends-c5552
          channelId: live
      - name: Publishing skipped
        if: env.FIREBASE_SA == ''
        run: echo "::notice::Web app built but not published. Add the FIREBASE_SERVICE_ACCOUNT_ANDFRIENDS_C5552 secret (docs/iphone-web-app.md) to publish automatically."

  # The same web app on GitHub Pages: https://42seconds.github.io/friends-app/
  # Published on every push to master that passes the checks. Free, and
  # needs no keys (it uses the repository's own GitHub token).
  pages:
    name: Publish web app to GitHub Pages
    needs: [checks, rules]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Build web app for /friends-app/
        run: npx expo export --platform web --output-dir pages-dist
        env:
          WEB_BASE_URL: /friends-app
      - name: Prepare for GitHub Pages
        run: node scripts/prepare-pages.mjs pages-dist /friends-app
      # Fails until Pages is switched on (Settings → Pages → Source:
      # GitHub Actions); then the publish steps are skipped, not failed.
      - name: Check GitHub Pages is switched on
        id: configure
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Pages is off
        if: steps.configure.outcome != 'success'
        run: echo "::warning::GitHub Pages is switched off. Turn it on in Settings, Pages, Source set to GitHub Actions, then re-run this job."
      - uses: actions/upload-pages-artifact@v3
        if: steps.configure.outcome == 'success'
        with:
          path: pages-dist
      - name: Publish
        id: deploy
        if: steps.configure.outcome == 'success'
        uses: actions/deploy-pages@v4
