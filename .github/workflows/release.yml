# Publishes a GitHub Release with the Android APK attached.
#
# To make a release: bump "version" (and android.versionCode) in app.json
# and push to master. This checks the code, builds the APK and publishes
# the release "&friends v1.1.0" (creating the tag v1.1.0) with
# andfriends-v1.1.0.apk attached. The README's "latest release" link then
# points to it. A version that already has a release is skipped.
# Also runs for a pushed v* tag, or by hand: Actions → Release → Run workflow.
name: Release

on:
  push:
    branches: [master]
    paths: ['app.json', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build APK and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Which version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(node -p "require('./app.json').expo.version")"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $TAG already exists; nothing to do. Bump the version in app.json for a new one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.v.outputs.exists == 'false'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: steps.v.outputs.exists == 'false'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - if: steps.v.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v5
      - if: steps.v.outputs.exists == 'false'
        run: npm ci --legacy-peer-deps
      - name: Typecheck and unit tests
        if: steps.v.outputs.exists == 'false'
        run: |
          npm run typecheck
          npm test -- --ci
      - name: Generate the native Android project
        if: steps.v.outputs.exists == 'false'
        run: npx expo prebuild --platform android --no-install
      # Signed with the debug key so it installs straight onto a phone.
      - name: Build APK
        if: steps.v.outputs.exists == 'false'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Name the APK
        if: steps.v.outputs.exists == 'false'
        run: cp android/app/build/outputs/apk/release/app-release.apk "andfriends-${{ steps.v.outputs.tag }}.apk"
      - name: Publish the release
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "&friends ${{ steps.v.outputs.tag }}"
          files: andfriends-${{ steps.v.outputs.tag }}.apk
          generate_release_notes: true
          make_latest: true
          body_path: docs/release-notes.md
