# Publishes a GitHub Release with the Android APK attached.
#
# To make a release: bump "version" (and android.versionCode) in app.json,
# then push a tag, e.g.
#   git tag v1.1.0 && git push origin v1.1.0
# This checks the code, builds the APK and publishes the release
# "&friends v1.1.0" with andfriends-v1.1.0.apk attached. The README's
# "latest release" link then points to it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build APK and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci --legacy-peer-deps
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test -- --ci
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
      # Signed with the debug key so it installs straight onto a phone.
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "andfriends-${GITHUB_REF_NAME}.apk"
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: "&friends ${{ github.ref_name }}"
          files: andfriends-${{ github.ref_name }}.apk
          generate_release_notes: true
          make_latest: true
          body_path: docs/release-notes.md
