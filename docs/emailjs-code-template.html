<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="x-apple-disable-message-reformatting">
<title>{{subject}}</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Sans:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  /* Nothing may be wider than the screen: long words wrap, tables shrink. */
  body, table, td { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table { border-collapse: separate; }
  td { word-break: break-word; overflow-wrap: anywhere; }
  img { max-width: 100%; height: auto; }
  /* Phones */
  @media only screen and (max-width: 480px) {
    .outer { padding: 12px 8px !important; }
    .pad { padding-left: 16px !important; padding-right: 16px !important; }
    .heading { font-size: 36px !important; }
    .amp { font-size: 64px !important; }
    .code { font-size: 28px !important; letter-spacing: 4px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#E8E3D7;width:100%;">
<!-- &FRIENDS one-time code email (EmailJS template). Same look as the
     "Emails" designs in the &FRIENDS App Redesign canvas. Filled in by
     the app: {{heading}}, {{message}}, {{code}}, {{time}}, {{header_bg}},
     {{header_fg}}, {{subject}}. Works down to 280px wide screens. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#E8E3D7;width:100%;table-layout:fixed;">
  <tr>
    <td class="outer" align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:480px;table-layout:fixed;background:#FFFFFF;border:1.5px solid #DDD7C9;border-radius:18px;overflow:hidden;">
        <!-- Header band -->
        <tr>
          <td class="pad" style="background:{{header_bg}};color:{{header_fg}};padding:22px 24px 24px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;">
              <tr>
                <td valign="top" style="font-family:'Bebas Neue',Impact,'Arial Narrow',Arial,sans-serif;font-size:18px;letter-spacing:0.5px;color:{{header_fg}};padding-bottom:12px;">&amp;FRIENDS</td>
                <td class="amp" width="64" rowspan="2" align="right" valign="top" style="width:64px;font-family:'Bebas Neue',Impact,'Arial Narrow',Arial,sans-serif;font-size:96px;line-height:0.8;color:{{header_fg}};opacity:0.18;overflow:hidden;">&amp;</td>
              </tr>
              <tr>
                <td class="heading" valign="bottom" style="font-family:'Bebas Neue',Impact,'Arial Narrow',Arial,sans-serif;font-size:46px;line-height:0.92;color:{{header_fg}};text-transform:uppercase;">{{heading}}</td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- Body -->
        <tr>
          <td class="pad" style="padding:24px 24px 8px;font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;color:#3A362F;">
            {{message}}
          </td>
        </tr>
        <!-- The code -->
        <tr>
          <td class="pad" style="padding:12px 24px 4px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;background:#15130F;border-radius:14px;">
              <tr>
                <td align="center" style="padding:10px 12px 0;font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;color:#B9B2A4;">YOUR CODE</td>
              </tr>
              <tr>
                <td class="code" align="center" style="padding:6px 12px 16px;font-family:'JetBrains Mono',Menlo,Consolas,'Courier New',monospace;font-size:34px;font-weight:700;letter-spacing:6px;line-height:1.2;color:#F3F0E8;word-break:break-all;">{{code}}</td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- Details -->
        <tr>
          <td class="pad" style="padding:12px 24px 4px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background:#F7F5F0;border-radius:14px;">
              <tr class="row">
                <td width="40%" style="padding:11px 14px;font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-size:14px;color:#5E594F;">Expires</td>
                <td class="value" width="60%" align="right" style="padding:11px 14px;font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-size:14px;font-weight:700;color:#15130F;">{{time}} · 10 min</td>
              </tr>
              <tr><td colspan="2" style="padding:0 14px;"><div style="height:1px;line-height:1px;font-size:1px;background:#E6E0D3;">&nbsp;</div></td></tr>
              <tr class="row">
                <td width="40%" style="padding:11px 14px;font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-size:14px;color:#5E594F;">Enter it in</td>
                <td class="value" width="60%" align="right" style="padding:11px 14px;font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-size:14px;font-weight:700;color:#15130F;">The &amp;friends app</td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td class="pad" style="padding:16px 24px 24px;font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#8F887A;">
            Didn't ask for this? Ignore this email; your account is safe. Never share this code: &amp;FRIENDS will never ask you for it.
          </td>
        </tr>
      </table>
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:480px;">
        <tr>
          <td align="center" style="padding:16px 8px 0;font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-size:12px;color:#8F887A;">&amp;FRIENDS · Braamfontein, Johannesburg</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
