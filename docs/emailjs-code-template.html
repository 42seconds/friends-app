<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{subject}}</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Sans:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:#E8E3D7;">
<!-- &FRIENDS one-time code email (EmailJS template). Same look as the
     "Emails" designs in the &FRIENDS App Redesign canvas. Filled in by
     the app: {{heading}}, {{message}}, {{code}}, {{time}}, {{header_bg}},
     {{header_fg}}, {{subject}}. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#E8E3D7;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background:#FFFFFF;border:1.5px solid #DDD7C9;border-radius:18px;overflow:hidden;">
        <!-- Header band -->
        <tr>
          <td style="background:{{header_bg}};color:{{header_fg}};padding:22px 24px 26px;position:relative;overflow:hidden;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td valign="top" style="font-family:'Bebas Neue',Impact,'Arial Narrow',Arial,sans-serif;font-size:18px;letter-spacing:0.5px;color:{{header_fg}};padding-bottom:14px;">&amp;FRIENDS</td>
                <td rowspan="2" align="right" valign="top" style="font-family:'Bebas Neue',Impact,'Arial Narrow',Arial,sans-serif;font-size:120px;line-height:0.8;color:{{header_fg}};opacity:0.18;">&amp;</td>
              </tr>
              <tr>
                <td valign="bottom" style="font-family:'Bebas Neue',Impact,'Arial Narrow',Arial,sans-serif;font-size:48px;line-height:0.92;color:{{header_fg}};text-transform:uppercase;">{{heading}}</td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- Body -->
        <tr>
          <td style="padding:24px 24px 8px;font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;color:#3A362F;">
            {{message}}
          </td>
        </tr>
        <!-- The code -->
        <tr>
          <td style="padding:12px 24px 4px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#15130F;border-radius:14px;">
              <tr>
                <td align="center" style="padding:6px 16px 0;font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;color:#B9B2A4;">YOUR CODE</td>
              </tr>
              <tr>
                <td align="center" style="padding:6px 16px 18px;font-family:'JetBrains Mono',Menlo,Consolas,'Courier New',monospace;font-size:38px;font-weight:700;letter-spacing:8px;color:#F3F0E8;">{{code}}</td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- Details -->
        <tr>
          <td style="padding:12px 24px 4px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F7F5F0;border-radius:14px;">
              <tr>
                <td style="padding:11px 16px;font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-size:14px;color:#5E594F;border-bottom:1px solid #E6E0D3;">Works until</td>
                <td align="right" style="padding:11px 16px;font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-size:14px;font-weight:700;color:#15130F;border-bottom:1px solid #E6E0D3;">{{time}} (10 minutes)</td>
              </tr>
              <tr>
                <td style="padding:11px 16px;font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-size:14px;color:#5E594F;">Where to enter it</td>
                <td align="right" style="padding:11px 16px;font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-size:14px;font-weight:700;color:#15130F;">The &amp;friends app</td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td style="padding:16px 24px 24px;font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#8F887A;">
            Didn't ask for this? Ignore this email; your account is safe. Never share this code, &amp;FRIENDS will never ask you for it.
          </td>
        </tr>
      </table>
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
        <tr>
          <td align="center" style="padding:16px 8px 0;font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-size:12px;color:#8F887A;">&amp;FRIENDS · Braamfontein, Johannesburg</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
